[package]
name = "zen-core"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = { workspace = true }
dotenvy = { workspace = true }
home = { workspace = true }
include_dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
rig-compose = { workspace = true }
tracing = { workspace = true }
notify-rust = { workspace = true }
libc = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }

[features]
# Test-only (T111/T118): makes `user_root()` read ZEN_HOME fresh on every
# call and fall back to a per-process temp dir when ZEN_HOME is unset, so
# test binaries that link zen-core WITHOUT `cfg(test)` (integration tests
# and inline `#[cfg(test)]` modules of dependent crates) never resolve the
# developer's real `~/.zen`. Enabled via `[dev-dependencies]` in crates
# whose tests emit audit lines (zen-agents, zen-gateway, zen-cli).
test-support = []

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
