[package]
name = "zen-agents"
version.workspace = true
edition.workspace = true
description = "Agent registry — WHO am I (agent definitions, tool permissions)"

[dependencies]
zen-core = { path = "../zen-core" }
zen-memory = { path = "../zen-memory" }
zen-provider = { path = "../zen-provider" }
zen-repo = { path = "../zen-repo" }
zen-plugin = { path = "../zen-plugin" }
zen-vault = { path = "../zen-vault" }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }
rig-core = { workspace = true }
rig-agent = { workspace = true }
rig-compose = { workspace = true }
rig-resources = { workspace = true }
rig-mcp = { workspace = true }
# FR-009 DST Tier 3b: feature OFF = shuttle-tokio re-exports real tokio
# byte-identically; feature ON swaps in shuttle-compatible primitives.
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
arrow = { workspace = true }
fs2 = { workspace = true }
jsonschema = { workspace = true }
# prod sha2 consumer: content_sha8 (scheduler workers, CSO log-leak mask)
sha2 = { workspace = true }

[features]
shuttle = ["tokio/shuttle"]

[dev-dependencies]
shuttle = "0.9.8"
# T278: formal/ plan_layers_verify.rs mounts into plan_task's test mod —
# plain-cargo congruence pin needs the verus! macro (ghost code cfg-erases).
vstd = { version = "=0.0.0-2026-10-18-0147" }
# T111/T118: test builds must never resolve the real ~/.zen — the
# test-support feature makes user_root() read ZEN_HOME fresh + temp-fallback.
zen-core = { path = "../zen-core", features = ["test-support"] }
rig-core = { workspace = true, features = ["test-utils"] }
wat = "1"
sha2 = { workspace = true }
tempfile = { workspace = true }
home = { workspace = true }
