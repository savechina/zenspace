[package]
name = "zen-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Zenspace CLI — productivity suite"

[dependencies]
sysinfo.workspace = true
zen-service = { path = "../zen-service" }
zen-gateway = { path = "../zen-gateway" }
zen-core = { path = "../zen-core" }
zen-auth = { path = "../zen-auth" }
zen-vault = { path = "../zen-vault" }
zen-agents = { path = "../zen-agents" }
zen-memory = { path = "../zen-memory" }
zen-provider = { path = "../zen-provider" }
zen-plugin = { path = "../zen-plugin" }
zen-repo = { path = "../zen-repo" }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
colored = { workspace = true }
dotenvy = { workspace = true }
rpassword = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
rig-compose = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
which = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-textarea-2 = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
tui-markdown = { workspace = true }
mdstream = { workspace = true }
ansi-to-tui = { workspace = true }
ratatui-themes = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
reqwest = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
unicode-width = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
nucleo = { workspace = true }
nucleo-matcher = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# T111/T118: test builds must never resolve the real ~/.zen — the
# test-support feature makes user_root() read ZEN_HOME fresh + temp-fallback.
zen-core = { path = "../zen-core", features = ["test-support"] }
portable-pty = "0.9.0"
tempfile = { workspace = true }
vt100 = "0.16.2"
divan = { workspace = true }
# FR-009 DST: real-tokio broadcast models the gateway event feed under the
# shuttle runtime (real-tokio sync primitives are executor-agnostic; the
# shuttle-tokio broadcast impl is a stub).
tokio_real = { package = "tokio", version = "1.47.1", features = ["sync"] }
shuttle = "0.9.8"

[[bench]]
name = "markdown_render"
harness = false

[features]
# exposes tui/ to external bench targets (lib.rs cfg seam; lint --all-features compiles it)
bench = []
# FR-009 DST (bbtree Guard-3): feature OFF = shuttle-tokio re-exports real
# tokio byte-identically; feature ON swaps in shuttle-compatible primitives
# for deterministic schedule exploration (`bin/verify` runs the dst_ tests).
shuttle = ["tokio/shuttle"]
