[package]
name = "zen-provider"
version.workspace = true
edition.workspace = true
description = "Multi-model provider connections using rig-core for zenspace"

[dependencies]
url.workspace = true
zen-core = { path = "../zen-core" }
zen-auth = { path = "../zen-auth" }
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
rig-core = { workspace = true }
rig-agent = { workspace = true }
rig-compose = { workspace = true }
fastembed = { workspace = true }
home = { workspace = true }

# Intel macOS has no prebuilt ONNX Runtime since ort-sys 2.0.0-rc.12
# (Microsoft ended x64 macOS support at 1.24.1; pykeio/ort#556) — the
# download-binaries config above fails to build on x86_64-apple-darwin.
# Fall that target back to runtime dlopen: compile always succeeds, and the
# embedding router degrades when no libonnxruntime is present at runtime.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies.fastembed]
workspace = true
features = ["ort-load-dynamic"]

[features]
# FR-042 DST (bbtree Guard-3): feature OFF = shuttle-tokio re-exports real
# tokio byte-identically; feature ON swaps in shuttle-compatible primitives
# for deterministic schedule sweep of the guarded stream forwarder.
shuttle = ["tokio/shuttle"]

[dev-dependencies]
shuttle = "0.9.8"
tempfile = { workspace = true }
