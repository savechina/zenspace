# Secret-leak prevention (CSO audit 2026-10-24 T265).
# Git history verified clean at enactment (git grep over rev-list --all = 0 hits);
# this config prevents future regressions. Runs via .github/workflows/rust.yml
# "secrets" job (push + PR on main) and can be run locally:
#   gitleaks detect --no-banner --report-path /tmp/leaks.json
# Allowlist rationale: test fixtures intentionally contain fake keys with the
# sk- prefix shape to prove masking/truncation behavior; those are harmless by
# construction (no network reach) and are excluded below.

title = "zenspace secret-leak prevention"

[extend]
# Default gitleaks rules cover standard providers (openai/anthropic/aws/etc.).
useDefault = true

[allowlist]
description = "Test fixtures with synthetic key shapes; docs examples"
paths = [
  '''(^|/)tests/.*''',
  '''(^|/)benches/.*''',
  # Secrets Guard (FR-042) pins live in-file under #[cfg(test)]: the engine's
  # own fixtures (ghp_/AKIA/jwt/private-key/npm_ shapes, all synthetic) must
  # be scannable by zen yet invisible to this scanner. Single exact file —
  # never a src/ wildcard, so real leaks elsewhere still fail CI.
  '''crates/zen-core/src/secrets_guard\.rs$''',
]
regexes = [
  # Local placeholder / obviously-fake literals used in examples and configs.
  '''sk-(REDACTED|EXAMPLE|PLACEHOLDER|xxx|X{5,}|test|dummy|your[_-]*)''',
  # Provider config doc samples that ship empty.
  '''[A-Za-z0-9_]*_API_KEY\s*=\s*("")''',
]
