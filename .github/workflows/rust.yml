name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-15-intel    # mac-x86
          - macos-latest      # mac-arm
          - ubuntu-latest     # linux-x86
          - ubuntu-24.04-arm  # linux-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Install lld (required by aws-lc-sys / rustls)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Run lint
        run: bin/lint

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-15-intel    # mac-x86
          - macos-latest      # mac-arm
          - ubuntu-latest     # linux-x86
          - ubuntu-24.04-arm  # linux-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Install lld (required by aws-lc-sys / rustls)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build
        run: bin/build
      - name: Run tests
        run: bin/test
      - name: Run lint
        run: bin/lint
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-${{ matrix.os }}
          path: target/release/zen
          if-no-files-found: error
