name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-15-intel     # mac-x86
          - macos-latest       # mac-arm
          - ubuntu-latest      # linux-x86
          - ubuntu-24.04-arm   # linux-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Force bfd linker (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=bfd" >> "$GITHUB_ENV"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      # bin/lint = clippy + fmt --check — it compiles but never EXECUTES tests,
      # so the ripgrep binary is not needed here (installed in the build job,
      # where tier-1 search tests shell out to `rg`).
      - name: Run lint
        run: bin/lint

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install tmux (L4 smoke dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Verify tmux present (fail closed — L4 must not silently skip in CI)
        run: command -v tmux
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui
          cache-on-failure: true
      - name: TUI verification pipeline (L1 headless + L2 session + guard + L3 PTY + L4 tmux)
        env:
          TERM: xterm
        run: bin/test-tui

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-15-intel     # mac-x86
          - macos-latest       # mac-arm
          - ubuntu-latest      # linux-x86
          - ubuntu-24.04-arm   # linux-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Force bfd linker (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=bfd" >> "$GITHUB_ENV"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: true
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build
        run: bin/build
      - name: Run tests
        run: bin/test
      # No `Run lint` here — the parallel `lint` job runs the identical
      # bin/lint on the same matrix; a second pass recompiles all deps via
      # clippy-driver (incompatible with rustc artifacts) for zero benefit.
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: zen-${{ matrix.os }}
          path: target/debug/zen
          if-no-files-found: error
