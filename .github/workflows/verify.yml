name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # bbtree Guard-3 gate (T274): Verus proofs + deterministic simulation
  # sweeps + runtime congruence pins. Local equivalent: bin/verify.
  #
  # Toolchain pin lives in formal/verus.json (vest pattern: version-pinned
  # binary release, never a floating cargo install): the install step reads
  # version + rustup_toolchain + the linux asset sha256 from that file, and
  # the gate itself runs through bin/verify so CI and local share ONE
  # implementation (no duplicated cargo invocations here).
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pinned Verus toolchain
        run: |
          PIN=$(python3 -c "import json;print(json.load(open('formal/verus.json'))['version'])")
          TOOLCHAIN=$(python3 -c "import json;print(json.load(open('formal/verus.json'))['rustup_toolchain'])")
          ASSET="verus-${PIN}-x86-linux.zip"
          SHA=$(python3 -c "import json,sys;print(json.load(open('formal/verus.json'))['asset_sha256'][sys.argv[1]])" "$ASSET")
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          curl -fsSL "https://github.com/verus-lang/verus/releases/download/release/${PIN}/${ASSET}" -o /tmp/verus.zip
          echo "${SHA}  /tmp/verus.zip" | sha256sum -c -
          # Release zips nest ALL entries under a single verus-x86-linux/
          # top-level dir (verus build.yml zips the staging dir itself).
          # Flatten so ~/.verus has binaries at top level — the layout
          # bin/verify assumes.
          unzip -q /tmp/verus.zip -d /tmp/verus-extract
          set -- /tmp/verus-extract/*/
          INNER=${1%/}
          [ -d "$INNER" ] || { echo "unexpected verus zip layout: no verus-* dir at zip root" >&2; exit 1; }
          rm -rf "$HOME/.verus"
          mv "$INNER" "$HOME/.verus"
          echo "$HOME/.verus" >> "$GITHUB_PATH"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          cache-on-failure: true
      - name: Verus proofs (formal/ sidecar)
        run: bin/verify verus
      - name: Runtime congruence pins
        run: bin/verify pins

  dst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dst
          cache-on-failure: true
      # Deterministic schedule sweeps (shuttle): FR-009 TUI forwarder,
      # hosting turn-terminal race, FR-042 streaming forwarder. Feature
      # OFF builds stay byte-identical; these runs compile the shuttle
      # feature on per crate. Same command as `bin/verify dst`.
      - name: Deterministic schedule sweeps
        run: bin/verify dst
