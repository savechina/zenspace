# =============================================================================
# Feature flags
# =============================================================================

[features]
multi_agent = true
auto_research = true

# =============================================================================
# QQ Bot integration (FR-004)
# =============================================================================

# [qqbot]
# app_id = ""
# token_env = "QQBOT_TOKEN"
# secret_env = "QQBOT_SECRET"
# groups = []

# =============================================================================
# Cron scheduling
# =============================================================================

[cron]
consolidation_time = "02:00"
timezone = "Asia/Shanghai"
subconscious_interval_minutes = 5
dream_start_hour = 2
dream_end_hour = 4

# =============================================================================
# Plugin system — flat [plugin.{id}] layout
# =============================================================================
#
# Known fields under [plugin] are: base_path, wasm_cache_path.
# All other [plugin.{id}] sections are treated as plugin instances.
# Each plugin instance has `enabled` (default: true) and any additional fields
# are folded into a flexible config JSON object.
#
# Layout:
#   [plugin]                    ← global plugin config (known fields)
#   [plugin.learning]           ← plugin "learning" instance config
#   [plugin.finance]            ← plugin "finance" instance config
#   [plugin.auto_proceed]       ← plugin "auto_proceed" instance config
# =============================================================================

[plugin]
base_path = "~/.zen/plugins"
wasm_cache_path = "~/.zen/plugins/cache"

[plugin.learning]
enabled = true
auto_research = true
interval = "daily"

[plugin.finance]
enabled = true
base_currency = "CNY"
disclaimer_acknowledged = false
# tracked_categories = ["food", "transport", "entertainment"]

# =============================================================================
# MCP Servers (FR-013)
#   The agent can connect to external MCP servers (stdio transport) to expose
#   additional tools. Servers must be trusted before use:
#       zen plugin mcp list        ← show servers + trust status
#       zen plugin mcp trust <name>  ← allow the agent to use the server's tools
#       zen plugin mcp untrust <name>
#   Example (Brave Search):
#   [[mcp_servers]]
#   name = "brave"
#   transport = "stdio"
#   command = "npx"
#   args = ["-y", "@modelcontextprotocol/server-brave-search"]
#   env = { BRAVE_API_KEY = "..." }
# =============================================================================

# =============================================================================
# Sandbox Hardening (FR-036/037/038/041/045, v0.0.6)
# =============================================================================

[sandbox.rlimits]
# Applied at ZenWiring construction (FR-038). Defaults: NPROC=50, NOFILE=256, CORE=0.
# max_processes = 50
# max_open_files = 256
# max_core_size = 0

[sandbox.env_scrub]
# Secret-bearing env vars are stripped from child processes (shell.exec, MCP
# stdio). Pattern-matched: *_API_KEY, *_TOKEN, *_SECRET, *_PASSWORD, *_CREDENTIAL.
# extra_scrub = ["MY_EXTRA_SECRET_VAR"]
# allowlist = ["PUBLICLY_SAFE_TOKEN"]

[sandbox.network_policy]
# Default denies link-local (169.254/16 incl. cloud metadata), loopback, and
# RFC1918 ranges; allow_hosts exempts specific hosts (local providers).
# allow_hosts = ["localhost", "127.0.0.1"]
# allow_private_ranges = false

[session]
# Drain window for SIGINT/SIGTERM graceful shutdown (FR-041).
drain_timeout_secs = 5

[tools.fs_watcher]
# Per-session watcher cap (FR-045).
max_watchers = 8
