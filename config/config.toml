# =============================================================================
# Cron scheduling
# =============================================================================

[cron]
consolidation_time = "02:00"
timezone = "Asia/Shanghai"
subconscious_interval_minutes = 5
dream_start_hour = 2
dream_end_hour = 4

# =============================================================================
# Plugin system
# =============================================================================

[plugin]
scan_dir = "~/.zen/plugins"
wasm_cache_dir = "~/.zen/plugins/cache"

# =============================================================================
# Learning / auto-research
# =============================================================================

[learning]
auto_research = true
interval = "daily"

# =============================================================================
# Finance aggregation
# =============================================================================

[finance]
base_currency = "CNY"
disclaimer_acknowledged = false
