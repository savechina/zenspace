[workspace]
members = [
    "crates/zen",
    "crates/zen-cli",
    "crates/zen-core",
    "crates/zen-repo",
    "crates/zen-auth",
    "crates/zen-vault",
    "crates/zen-memory",
    "crates/zen-agents",
    "crates/zen-gateway",
    "crates/zen-provider",
    "crates/zen-service",
    "crates/zen-plugin",
]
resolver = "2"


[workspace.package]
edition = "2024"
repository = "https://github.com/savechina/zenspace"
homepage = "https://github.com/savechina/zenspace"
license = "MIT"
description = "Zenspace AI Agents productivity suite，个人生产力套件"
version = "0.0.7"

[workspace.dependencies]
clap = { version = "4.5.39", features = ["derive", "env", "string"] }
bigdecimal = { version = "0.4.8", features = ["serde", "serde_json"] }
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "local-time"] }
which = "8.0.0"
uuid = { version = "1.16.0", features = ["v3", "v5", "v7", "serde"] }
rand = "0.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
async-trait = "0.1"
tera = "2.1"
include_dir = { version = "0.7.4", features = ["glob", "metadata"] }
config = "0.15.15"
anyhow = "1.0.99"
getset = "0.1.6"
serde_derive = "1.0.221"
tempfile = "3.22.0"
home = "0.5.11"
chrono = { version = "0.4.42", features = ["serde"] }
heck = "0.5.0"
typed-builder = "0.23.2"
strum = { version = "0.28.0", features = ["derive","phf"] }
sqlx = { version = "0.9.0", features = [
    "bigdecimal",
    "chrono",
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1.47.1", features = ["full"] }
fs_extra = "1.3.0"
glob = "0.3.3"
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }

# Scheduler (ZenScheduler — cron expression parsing, D11)
cron = "0.17"

# macOS Keychain (FR-061)
security-framework = "3.0"

toml = "1.1.2"
rusqlite = { version = "0.32", features = ["bundled", "functions", "uuid"] }
tokio-rusqlite = "0.6"
libc = "0.2"
url = "2"
sqlite-vec = "0.1"

# TUI (FR-001 — ratatui + crossterm)
# NOTE: scrolling-regions feature intentionally NOT enabled. It makes
# Terminal::insert_before scroll via CSI S region scrolling, which DISCARDS
# rows scrolled past the region top instead of pushing them into the native
# terminal scrollback. The inline TUI needs full-screen append_lines scrolling
# so banner + output stay selectable/copyable in scrollback (codex-style).
ratatui = { version = "0.30" }
crossterm = "0.29"
tui-textarea-2 = "0.12"

# Syntax highlighting (FR-TUI-022 — syntect + two-face, follows Codex CLI pattern)
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5", features = ["syntect-default-onig"] }

# Markdown rendering (FR-TUI-023 — tui-markdown 0.3.9 wraps pulldown-cmark, supports headings/tables/code highlight)
tui-markdown = { version = "0.3.9", features = ["highlight-code"] }
# Streaming markdown parser (Committed/Pending split for incremental rendering)
mdstream = "0.3.0"
ansi-to-tui = "8.0.1"
ratatui-themes = "0.2.0"

# HTTP client for LLM providers
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "stream", "rustls"] }

# HTML-to-markdown conversion
html2md = "0.2"

# Agent tools (003-agentic-plugin): HTML parsing, article extraction, diff patching
scraper = "0.27"
htmd = "0.5"
readabilityrs = "0.1"
# FR-021 unified-diff apply for fs.edit. NOTE: `similar` (spec's original pick)
# only *emits* diffs — it has no parser/applyer in any version (2.x/3.x).
# `diffy` is the maintained library with Patch::from_str + apply().
diffy = "0.5"
regex = "1"

# WebSocket client for QQ Bot
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP server for gateway daemon
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# LLM agent orchestration framework
rig-core = "0.41"
rig = { version = "0.41", package = "rig-core" }
rig-agent = "0.41"

# Composable agent kernel: stateless skills, transport-agnostic tools, registry-driven agents
rig-compose = "0.5"

# Resource adapters and projection helpers for rig-compose (Evidence → ContextItem bridge)
rig-resources = "0.2"

rig-memory = "0.38.2"

# MCP bridge for rig-compose tools
rig-mcp = "0.2"

# Observability event schema for Rig agents
rig-tap = "0.3"

# Persistent memory and vector store for Rig agents
rig-memvid = { version = "0.4.2", features = ["context-projection", "compaction"] }
rig-sqlite = "0.41"

# Utility crates — shared across workspace
fastrand = "2"
schemars = "1"
colored = "3"
rpassword = "7"
unicode-width = "0.2.2"
unicode-normalization = "0.1"
fs2 = "0.4"
sha2 = { version = "0.11", default-features = false }
serde_yaml = "0.9"
walkdir = "2"

# Arrow for zero-copy inter-agent data transfer (FR-SO-005)
arrow = "59"

futures = "0.3"

# Fast embed: local ONNX inference for async batch embedding + Rerank pipeline
fastembed = { version = "5.17", default-features = false, features = ["hf-hub-rustls-tls", "image-models", "ort-load-dynamic"] }

# Plugin system: WASM sandbox + MCP server
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = { version = "47", features = ["p1", "p2", "p3"] }

# Linux 3-layer sandbox (FR-028): bubblewrap (namespaces) + landlock (filesystem) + seccompiler (seccomp-bpf)
# bubblewrap-sys bundles bwrap but requires Meson build system; use system package instead
landlock = "0.4.7"
seccompiler = "0.5.0"

# Cross-platform system tools
sysinfo = "0.39"
notify = "8"
notify-rust = "4"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

# Clipboard (FR-TUI-021 — output auto-copy + paste)
arboard = "3.6"
base64 = "0.23"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
